[project]
name = "maz-sv"
version = "0.2.2"
description = "Project-local AI agent skill manager"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["ai", "agents", "cli", "pi", "skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/HamdiMaz/sv"
Issues = "https://github.com/HamdiMaz/sv/issues"
Changelog = "https://github.com/HamdiMaz/sv/blob/master/CHANGELOG.md"

[project.scripts]
sv = "sv.cli:main"
svx = "sv.cli:svx_main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
    "--cov=sv",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
markers = [
    "integration: integration tests",
    "security: security tests",
]

[tool.coverage.run]
branch = true
source = ["sv"]
disable_warnings = ["module-not-measured"]
