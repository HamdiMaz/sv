[project]
name = "sv"
version = "0.1.0"
description = "Project-local AI agent skill manager"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sv = "sv.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
