name: Release readiness checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src tests

      - name: Test with coverage
        run: uv run pytest --cov=sv --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Smoke test built wheel
        run: |
          tmp_venv="$(mktemp -d)"
          trap 'rm -rf "$tmp_venv"' EXIT
          python -m venv "$tmp_venv"
          uv pip install --python "$tmp_venv/bin/python" --link-mode=copy --no-index dist/sv-0.1.0-py3-none-any.whl
          "$tmp_venv/bin/sv" --help
          "$tmp_venv/bin/python" -c 'import sv; assert sv.__version__ == "0.1.0", sv.__version__'
