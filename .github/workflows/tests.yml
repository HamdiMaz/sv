name: Release readiness checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check src tests

      - name: Test with coverage
        run: uv run pytest --cov=sv --cov-report=term-missing

      - name: Build package
        run: |
          rm -rf dist
          uv build

      - name: Smoke test built wheel
        run: |
          tmp_venv="$(mktemp -d)"
          trap 'rm -rf "$tmp_venv"' EXIT
          python -m venv "$tmp_venv"
          wheel_path="$(python -c 'from pathlib import Path; wheels = sorted(Path("dist").glob("skill_vault-*.whl")); assert len(wheels) == 1, wheels; print(wheels[0])')"
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv pip install --python "$tmp_venv/bin/python" --link-mode=copy --no-index "$wheel_path"
          "$tmp_venv/bin/sv" --help
          EXPECTED_SV_VERSION="$expected_version" "$tmp_venv/bin/python" -c 'import os, sv; assert sv.__version__ == os.environ["EXPECTED_SV_VERSION"], sv.__version__'
